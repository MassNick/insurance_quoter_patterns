<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soumission auto</title>
<meta name="description" content="Desjardins Assurances demo (Variation C): chat-first auto quote with small A2UI forms, document reading, drag-to-assign drivers, end-of-form rules and a developer trace. Simulated agents, no network calls.">
<!--
  LOCAL DEMO FOR A CLIENT. Simulated agents, no network calls.
  The brand mark is a hand-drawn approximation of the Desjardins logo used as a placeholder.
  Replace ICON.brand in a2ui.js with the official asset from the Desjardins brand team before showing it externally.
-->
<style>
/* styles.css: shared by the journey and the form gallery.
   Desjardins Assurances demo, Variation C "Assistant plein écran": Desjardins greens and mints, light
   green headings, rounded inputs and pill buttons, a 12-column grid for every A2UI form.
   LOCAL DEMO ONLY: the brand mark used by the pages is a placeholder approximation of the Desjardins
   logo; replace it with the official asset before any external showing. */
:root {
  --g: #00874E; --g2: #006B3F; --g3: #0B5A3A; --g-ink: #fff;
  --m1: #CDE7DA; --m2: #E3F1EA; --m3: #EEF6F2; --m4: #F6FBF8;
  --ink: #2B2B2B; --ink-2: #4F4F4F; --ink-3: #6B6B6B; --line: #8F8F8F; --line-2: #D6D6D6; --line-3: #E8E8E8;
  --gray: #F2F2F2; --warn: #9A4D00; --warn-soft: #FFF3E0; --danger: #B3261E; --danger-soft: #FCE8E6;
  --info: #0B5A8C; --info-soft: #E5F0F8; --violet: #6A3FA0; --violet-soft: #F1EAF9; --slate: #3D4F5C; --slate-soft: #E8EEF2;
  /* aliases used by the renderer and the trace */
  --accent: var(--g); --accent-ink: #fff; --accent-soft: var(--m2); --bg: var(--m3); --surface: #fff; --surface-2: var(--m4); --surface-3: var(--gray);
  --font: "Roboto", "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.10);
  --shadow-card: 0 1px 3px rgba(0,0,0,.08), 0 6px 20px rgba(0,40,20,.07);
  --shadow-lg: 0 20px 60px rgba(0,30,15,.22);
  --r-card: 14px; --r-ctl: 10px; --r-bubble: 18px;
  --sat: 0px; --sab: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font: 15px/1.5 var(--font); color: var(--ink); background: linear-gradient(180deg, var(--m3), #fff 60%); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #1A73E8; outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
code { font-family: var(--mono); font-size: .92em; }

/* ---------- buttons ---------- */
.btn { border: 0; height: 44px; padding: 0 20px; border-radius: 999px; font-weight: 500; font-size: 15px; background: var(--gray); color: var(--g); display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: background .15s, transform .1s; }
.btn:hover { background: #E7E7E7; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--g); color: #fff; }
.btn.primary:hover { background: var(--g2); }
.btn.ghost { background: none; color: var(--g); text-decoration: underline; text-underline-offset: 3px; padding: 0 8px; font-size: 14px; }
.btn.ghost:hover { background: var(--m3); }
.btn.small { height: 34px; padding: 0 14px; font-size: 13.5px; }
.btn[aria-pressed="true"] { background: var(--g); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 44px; height: 44px; border: 1px solid var(--line-2); background: #fff; border-radius: 50%; display: grid; place-items: center; color: var(--g); flex: none; }
.icon-btn:hover { border-color: var(--g); }
.icon-btn.send { background: var(--g); color: #fff; border: 0; }
.icon-btn:disabled { opacity: .5; cursor: default; }

/* ---------- the bot: mini hexagon with eyes ---------- */
.avatar { width: 34px; height: 37px; flex: none; position: relative; display: inline-block; }
.avatar svg { width: 100%; height: 100%; overflow: visible; display: block; }
.avatar .hex { fill: var(--g); }
.avatar .lid { fill: #fff; }
.avatar .eye { transform-box: fill-box; transform-origin: center; animation: blinkeye 5s infinite; }
.avatar .pupil { fill: #12241B; transition: transform .35s cubic-bezier(.34,1.56,.64,1); }
.avatar.look-r .pupil { transform: translateX(1.6px); }
.avatar.look-l .pupil { transform: translateX(-1.6px); }
.avatar.think .pupil { animation: think 1.4s infinite ease-in-out; }
.avatar.happy .eye { animation: none; transform: scaleY(.35); }
.avatar.pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--g); animation: ring 1s ease-out forwards; }
@keyframes ring { from { opacity: .9; transform: scale(.8); } to { opacity: 0; transform: scale(1.6); } }
@keyframes blinkeye { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes think { 0%, 100% { transform: translate(-1.2px, -1px); } 50% { transform: translate(1.2px, -1px); } }

/* ---------- chat ---------- */
.chat { display: flex; flex-direction: column; min-height: 0; }
.chat-scroll { flex: 1; overflow-y: auto; padding: 14px 22px 8px; scroll-behavior: smooth; }
.msg { display: flex; gap: 10px; margin: 0 0 14px; align-items: flex-start; animation: msg-in .28s ease-out; }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.msg.user { justify-content: flex-end; }
.msg.system { justify-content: center; }
.bubble { max-width: 82%; min-width: 0; }
.msg.bot .bubble-body { background: #fff; border-radius: 4px var(--r-bubble) var(--r-bubble) var(--r-bubble); padding: 10px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
.msg.user .bubble-body { background: var(--g); color: #fff; border-radius: var(--r-bubble) 4px var(--r-bubble) var(--r-bubble); padding: 9px 14px; }
.msg.system .bubble-body { font-size: 12.5px; color: var(--ink-2); border: 1px dashed var(--line-2); padding: 5px 12px; border-radius: 999px; background: #fff; }
.bubble-body p { margin: 0 0 6px; } .bubble-body p:last-child { margin: 0; }
.bubble-body ul { margin: 4px 0 6px; padding-left: 20px; }
.bubble-body .cite { color: var(--g); font-size: 11px; font-weight: 700; vertical-align: super; }
.bubble-body .sources { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line-3); font-size: 12px; color: var(--ink-3); }
.caret { display: inline-block; width: 7px; height: 15px; background: var(--g); margin-left: 2px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.typing { display: inline-flex; gap: 5px; padding: 12px 14px; background: #fff; border-radius: 4px var(--r-bubble) var(--r-bubble) var(--r-bubble); box-shadow: 0 2px 10px rgba(0,0,0,.07); }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--g); opacity: .5; animation: bounce 1.2s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-6px); opacity: 1; } }
.offers-inline { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }

/* form chips: open → submitted (click to view or edit) → closed (click to reopen) */
.form-chip { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12.5px; font-weight: 600; color: var(--g); border: 1px solid var(--m1); background: #fff; padding: 4px 11px; border-radius: 999px; cursor: pointer; transition: background .15s, border-color .15s; max-width: 100%; }
.form-chip:disabled { cursor: default; }
.form-chip:not(:disabled):hover { background: var(--m3); border-color: var(--g); }
.form-chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--g); flex: none; }
.form-chip[data-state="open"] i { animation: dotpulse 1.2s ease-in-out infinite; }
@keyframes dotpulse { 50% { transform: scale(.6); opacity: .5; } }
.form-chip[data-state="closed"] i { background: var(--line); }
.form-chip svg { width: 13px; height: 13px; flex: none; }
.form-chip.done { color: var(--ink-2); }
.form-chip.done > svg { color: var(--g); }
.form-chip .chip-act { display: inline-flex; gap: 4px; align-items: center; margin-left: 4px; padding-left: 8px; border-left: 1px solid var(--m1); color: var(--g); text-decoration: underline; text-underline-offset: 2px; }
.form-chip .chip-st { margin-left: 4px; padding-left: 8px; border-left: 1px solid var(--m1); color: var(--ink-3); font-weight: 500; }
.form-chip.locked .chip-act { display: none; }
.form-chip .p-only { display: none; }

/* suggestion bubbles above the composer */
.sugg { display: flex; gap: 8px; padding: 10px 22px 4px; overflow-x: auto; flex-wrap: wrap; min-height: 10px; }
.sg { border: 1px solid var(--line-3); background: #fff; color: var(--ink); padding: 7px 14px; border-radius: 999px; font-weight: 500; font-size: 13.5px; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.06); transition: border-color .15s, color .15s, transform .15s; animation: pop .32s cubic-bezier(.34,1.56,.64,1) both; }
.sg:hover { border-color: var(--g); color: var(--g); }
.sg:active { transform: scale(.97); }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.92); } to { opacity: 1; transform: none; } }
.composer { display: flex; gap: 8px; padding: 10px 22px 16px; align-items: flex-end; }
.composer textarea { flex: 1; resize: none; min-height: 46px; max-height: 120px; border: 1px solid var(--line); border-radius: 24px; padding: 12px 18px; outline: none; background: #fff; }
.composer textarea:focus { border: 2px solid var(--g); padding: 11px 17px; }

/* ---------- A2UI form card ---------- */
.form-card { width: 100%; max-width: 760px; max-height: 100%; display: flex; flex-direction: column; background: #fff; border-radius: var(--r-card); box-shadow: var(--shadow-card), 0 18px 50px rgba(0,60,35,.10); overflow: hidden; }
.form-card.measuring { visibility: hidden; }
.form-head { padding: 22px 32px 4px; display: flex; gap: 12px; align-items: flex-start; }
.form-head h2 { margin: 0; font-size: 28px; font-weight: 300; color: var(--g); letter-spacing: -.01em; line-height: 1.2; }
.form-head .surface-id { display: none; font: 11px var(--mono); color: var(--ink-3); margin-top: 4px; }
body.dev .form-head .surface-id { display: block; }
.form-head .spacer { flex: 1; }
.form-head .btn.ghost { color: var(--ink-3); text-decoration: none; padding: 4px; height: auto; }
.form-body { padding: 12px 32px 24px; overflow-y: auto; flex: 1; }
.form-foot { padding: 14px 32px; border-top: 1px solid var(--line-3); display: flex; gap: 10px; align-items: center; background: #fff; flex-wrap: wrap; }
.form-foot .spacer { flex: 1; }
.form-foot .err-summary { color: var(--danger); font-weight: 600; font-size: 13px; }
.form-foot .err-summary:empty { display: none; }
.reveal > * { animation: field-in .35s ease-out both; }
@keyframes field-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* every A2UI form sits on a 12-column grid: a field spans 12, a Row splits it 6 + 6 */
.a2-col { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 16px; row-gap: 20px; align-items: start; }
.a2-col > * { grid-column: span 12; min-width: 0; }
.a2-row { grid-column: span 12; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: 16px; row-gap: 20px; }
.a2-row > * { grid-column: span 6; min-width: 0; }
.a2-row > :only-child { grid-column: span 12; }
.fld .a2-row { grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 10px; row-gap: 10px; }
.fld .a2-row > * { grid-column: auto; }
.a2-text-h3 { font-size: 13px; font-weight: 700; color: var(--g); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line-3); padding-bottom: 6px; margin-top: 4px; }
.a2-text-caption { font-size: 12.5px; color: var(--ink-3); }
.a2-text-body { font-size: 14px; }
.note { display: flex; gap: 10px; background: var(--m3); border-left: 4px solid var(--g); padding: 10px 14px; font-size: 13.5px; border-radius: 0 8px 8px 0; }
.note .ic { color: var(--g); flex: none; display: inline-flex; padding-top: 2px; }
.note.chat { flex-direction: row; min-height: auto; } /* tone "chat" must not pick up the .chat container layout */
.note.chat { background: var(--m4); }
.note.warn { background: var(--warn-soft); border-left-color: #F0A13B; }
.note.warn .ic { color: var(--warn); }
.note.ok { background: var(--m2); }

.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld[hidden] { display: none !important; }
.fld > label, .fld > .lbl { font-weight: 700; font-size: 14px; color: var(--ink); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 21px; }
.fld .req { color: var(--danger); margin-left: 1px; }
.fld .help { color: var(--g); display: inline-flex; cursor: help; border-radius: 50%; outline-offset: 1px; }
.fld .hint { font-size: 12.5px; color: var(--ink-2); font-style: italic; margin-top: -2px; }
.fld input[type=text], .fld input[type=email], .fld input[type=tel], .fld input[type=number], .fld input[type=date], .fld select, .fld textarea { height: 48px; width: 100%; border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 0 12px; background: #fff; outline: none; }
.fld textarea { height: auto; min-height: 120px; padding: 10px 12px; resize: vertical; line-height: 1.45; }
.fld input:focus, .fld select:focus, .fld textarea:focus { border: 2px solid var(--g); padding-left: 11px; }
.fld.invalid input, .fld.invalid select, .fld.invalid .chips, .fld.invalid .seg, .fld.invalid textarea { outline: 2px solid var(--danger); outline-offset: 1px; }
.fld .err { color: var(--danger); font-size: 12.5px; font-weight: 600; }
.fld .err:empty { display: none; }
.fld .ok-msg { color: var(--g); font-weight: 600; display: inline-flex; gap: 4px; align-items: center; }
.fld.autofilled input, .fld.autofilled select, .fld.autofilled .chips, .fld.autofilled .seg { animation: autofill 1.6s ease-out; }
@keyframes autofill { 0% { background: var(--m1); box-shadow: 0 0 0 4px var(--m2); } 100% { background: #fff; box-shadow: none; } }
.input-wrap { display: flex; gap: 8px; align-items: center; position: relative; }
.input-wrap .prefix { position: absolute; left: 12px; color: var(--ink-3); }
.input-wrap.has-prefix input { padding-left: 26px; }
.input-wrap input { flex: 1; }
.prov { display: flex; gap: 6px; align-items: center; min-height: 0; }
.prov:empty { display: none; }
.prov .badge { background: none; padding: 0; color: var(--g); font-size: 11.5px; font-weight: 600; display: inline-flex; gap: 5px; align-items: center; }
.fld .prov .badge { color: var(--g); }
.prov .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.prov .pnote { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--surface-3); color: var(--ink-2); }
.badge.chat { color: var(--violet); } .badge.document { color: var(--g); } .badge.lookup { color: var(--info); } .badge.form { color: var(--ink-2); } .badge.system { color: var(--slate); }
.badge.det { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.badge.pending { background: var(--warn-soft); color: var(--warn); }

/* choice controls: tiles */
.chips, .seg, .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.chip, .seg button { min-height: 52px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); padding: 10px 12px; text-align: left; transition: background .15s, color .15s, border-color .15s; }
.chip:hover, .seg button:hover { border-color: var(--g); }
.chip[aria-checked="true"], .seg button[aria-checked="true"] { background: var(--g); border-color: var(--g); color: #fff; }
.radios { display: flex; flex-direction: column; gap: 8px; }
.radio-card { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line-2); border-radius: 12px; background: #fff; padding: 10px 12px; }
.radio-card[aria-checked="true"] { border-color: var(--g); box-shadow: inset 0 0 0 1px var(--g); background: var(--m4); }
.radio-card .rdot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; margin-top: 2px; }
.radio-card[aria-checked="true"] .rdot { border: 6px solid var(--g); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; font-weight: 400; }
.fld > label.check { font-weight: 400; }
.check input { width: 20px; height: 20px; accent-color: var(--g); margin: 1px 0 0; flex: none; }
.slider-wrap { display: flex; gap: 14px; align-items: center; }
.slider-wrap input[type=range] { flex: 1; accent-color: var(--g); }
.slider-val { font-weight: 700; color: var(--g); min-width: 90px; text-align: right; }
.computed { font-size: 12.5px; color: var(--ink-3); }
.repeater { display: flex; flex-direction: column; gap: 10px; }
.rep-item { border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 14px 14px; background: var(--m4); }
.rep-head { display: flex; align-items: center; font-weight: 700; font-size: 13px; color: var(--g); margin-bottom: 8px; }
.rep-head .spacer { flex: 1; }
.rep-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.rep-grid > * { grid-column: span 4; }
.rep-grid > .fld:first-child { grid-column: span 5; }
.rep-grid > .fld:nth-child(2) { grid-column: span 4; }
.rep-grid > .fld:nth-child(3) { grid-column: span 3; }
.vin-row, .rep-line { display: flex; gap: 10px; align-items: center; }
.vin-row .vin-n { font: 600 12px var(--mono); color: var(--ink-3); min-width: 22px; }
.vin-status { font-size: 12px; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; display: inline-block; animation: spin .7s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
.matrix { border-collapse: collapse; width: 100%; font-size: 13.5px; }
.matrix th, .matrix td { padding: 6px 8px; border-bottom: 1px solid var(--line-3); text-align: left; }
.matrix th { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.matrix select { height: 38px; border: 1px solid var(--line); border-radius: 8px; padding: 0 8px; }
.offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.offer { position: relative; text-align: left; border: 1px solid var(--line-2); border-radius: 14px; background: #fff; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.offer[aria-checked="true"] { border: 2px solid var(--g); padding: 13px; box-shadow: 0 0 0 3px var(--m2); }
.offer .o-name { font-weight: 700; }
.offer .o-price { font-size: 24px; font-weight: 700; color: var(--g); }
.offer .o-price small { font-size: 13px; color: var(--ink-3); font-weight: 400; }
.offer ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-2); }
.offer .o-tag { position: absolute; top: -10px; right: 12px; background: var(--g); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 6px 14px; margin: 0; font-size: 13.5px; }
.summary dt { color: var(--ink-2); } .summary dd { margin: 0; font-weight: 600; }
.drop { border: 2px dashed var(--m1); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; background: var(--m4); color: var(--g); }
.drop.busy { opacity: .7; }
.extracted { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 13px; color: var(--ink); width: 100%; }
.conf { font-size: 11.5px; font-weight: 700; color: var(--g); background: var(--m2); border-radius: 999px; padding: 2px 8px; text-align: center; }
.conf.mid, .conf.lo { color: var(--warn); background: var(--warn-soft); }
.conflict { border: 1px solid #F0C27B; background: var(--warn-soft); border-radius: 12px; padding: 10px 12px; }

/* insurance catalog: DocumentDrop */
.docs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.doc { border: 1px solid var(--line-2); border-radius: var(--r-card); padding: 14px; display: flex; flex-direction: column; gap: 6px; background: #fff; position: relative; overflow: hidden; min-height: 184px; transition: border-color .2s, box-shadow .2s; }
.doc .dic { width: 44px; height: 44px; border-radius: 50%; background: var(--m2); color: var(--g); display: grid; place-items: center; margin-bottom: 4px; }
.doc b { font-size: 15px; }
.doc small { color: var(--ink-2); font-size: 12.5px; line-height: 1.4; }
.doc .dbtns { margin-top: auto; padding-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.doc .paper { position: absolute; left: 50%; top: 44%; width: 120px; height: 78px; transform: translate(-50%, -50%); border: 1px solid var(--line-2); border-radius: 6px; background: repeating-linear-gradient(180deg, #fff 0 11px, #EAF2EE 11px 13px); overflow: hidden; }

.doc .thumb span { position: absolute; left: 0; right: 0; bottom: 16px; text-align: center; font-size: 12.5px; color: var(--g); font-weight: 600; }
.doc.done { border-color: var(--g); box-shadow: inset 0 0 0 1px var(--g); }

.xrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 64px; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line-3); animation: msg-in .3s both; }
.xrow label { font-size: 13.5px; color: var(--ink-2); }
.xrow input, .xrow select { height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; width: 100%; outline: none; background: #fff; }
.xrow input:focus, .xrow select:focus { border: 2px solid var(--g); padding: 0 9px; }

/* insurance catalog: AssignmentBoard (drag to connect) */
.board { display: flex; flex-direction: column; gap: 16px; }
.pool { background: var(--m3); border: 1px dashed var(--m1); border-radius: var(--r-card); padding: 12px 14px; }
.pool-h { font-size: 13px; font-weight: 700; color: var(--g); text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }

.pool-chips { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.person { display: inline-flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 14px 5px 5px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); transition: box-shadow .15s, transform .15s, opacity .15s; }

.av.c0 { background: #00874E; } .av.c1 { background: #2F6690; } .av.c2 { background: #7A4B94; } .av.c3 { background: #A15C0C; } .av.c4 { background: #3D5A40; }
.vgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.vcard { border: 1px solid var(--line-2); border-radius: var(--r-card); background: #fff; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.vcard .vh { display: flex; gap: 10px; align-items: center; font-weight: 700; }

.slot { border: 2px dashed var(--line-2); border-radius: var(--r-ctl); padding: 8px 10px; min-height: 64px; display: flex; flex-direction: column; gap: 6px; transition: border-color .15s, background .15s, transform .2s cubic-bezier(.34,1.56,.64,1); }
.slot .slot-l { font-size: 11.5px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; display: flex; justify-content: space-between; }

.slot .ph { font-size: 12.5px; color: var(--ink-3); }

.slot.can { border-color: var(--g); }
.slot.over { border-color: var(--g); background: var(--m2); transform: scale(1.03); }
.slot.missing { border-color: var(--danger); }
.pchip { display: inline-flex; align-items: center; gap: 6px; background: var(--m2); border-radius: 999px; padding: 3px 4px 3px 3px; font-size: 13px; font-weight: 600; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; animation: pop .4s cubic-bezier(.34,1.56,.64,1); }

.dragghost { position: fixed; z-index: 95; pointer-events: none; margin: 0; transform: rotate(-3deg) scale(1.06); box-shadow: 0 16px 34px rgba(0,0,0,.28) !important; }
.board-msg { font-size: 13px; color: var(--warn); min-height: 18px; }
.board-tip { font-size: 12.5px; color: var(--ink-3); }

/* ---------- ball-to-form morph ---------- */
.morph { position: fixed; z-index: 60; background: var(--g); border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 6px rgba(0,135,78,.18), 0 10px 30px rgba(0,135,78,.35); }
.morph.card { background: #fff; box-shadow: var(--shadow-card); }

/* ---------- modal (Desjardins confirmation style) ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 80; padding: 16px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); background: #fff; border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden; animation: spring .5s cubic-bezier(.34,1.56,.64,1); }

.modal-head { background: var(--m3); padding: 18px 28px 14px; text-align: center; }

.modal-body { padding: 16px 28px 6px; color: var(--ink-2); font-size: 14px; }
.modal-body .change { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px 12px; background: var(--m4); border: 1px solid var(--m2); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }

.progress2 { display: flex; gap: 6px; justify-content: center; }
.progress2 i { width: 40px; height: 4px; border-radius: 4px; background: var(--line-2); }
.progress2 i.on { background: var(--g); }

/* ---------- JSON in the trace and gallery ---------- */
pre.json { font: 11.5px/1.5 var(--mono); background: #0F1F18; color: #D7E7DE; padding: 10px 12px; border-radius: 10px; overflow: auto; margin: 0; white-space: pre; }
pre.json .k { color: #8FD3B0; } pre.json .s { color: #F2C98A; } pre.json .n { color: #9BC3FF; } pre.json .b { color: #E7A1D8; }

/* ---------- phone ---------- */
@media (max-width: 600px) {
  .chat-scroll { padding: 10px 14px 6px; }
  .bubble { max-width: 86%; }
  .msg { gap: 8px; margin-bottom: 12px; }
  .avatar { width: 28px; height: 31px; }
  .sugg { flex-wrap: nowrap; padding: 8px 14px 2px; scrollbar-width: none; min-height: 0; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
  .sugg::-webkit-scrollbar { display: none; }
  .sg { flex: none; font-size: 14px; padding: 8px 14px; }
  .composer { padding: 8px 12px calc(10px + var(--sab)); }

  .form-body { padding: 10px 16px 18px; }

  .form-foot .err-summary { flex-basis: 100%; }
  .a2-col, .a2-row { column-gap: 12px; row-gap: 16px; }

  .rep-grid > *, .rep-grid > .fld:first-child, .rep-grid > .fld:nth-child(2), .rep-grid > .fld:nth-child(3) { grid-column: span 12; }
  .docs { grid-template-columns: 1fr; gap: 10px; }

  .xrow { grid-template-columns: minmax(0, 1fr) 56px; gap: 6px 10px; }

  .pool { position: sticky; top: -10px; z-index: 4; padding: 10px 12px; box-shadow: 0 8px 14px -10px rgba(0,0,0,.35); border-style: solid; }
  .pool-h span { display: none; }
  .pool-chips { gap: 8px; margin-top: 8px; }
  .person { padding: 4px 12px 4px 4px; gap: 8px; }
  .person b { font-size: 13.5px; }
  .person .where { display: none; }
  .av { width: 30px; height: 30px; font-size: 12px; }
  .vgrid { grid-template-columns: 1fr; gap: 12px; }
  .vcard { padding: 12px; }
  .board-tip { display: none; }
  .modal-back { place-items: end center; padding: 0; }

/* ---------- demo bar (not part of the product) ---------- */
.demo-bar { height: 44px; background: #1F1F1F; color: #EEE; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 13px; position: relative; z-index: 90; }

.demo-bar .seg2 { display: flex; background: #333; border-radius: 8px; padding: 3px; gap: 2px; }
.demo-bar .seg2 button { border: 0; background: none; color: #CCC; padding: 5px 12px; border-radius: 6px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }

/* ---------- app shell (Variation C) ---------- */
.app { height: calc(100vh - 44px); display: flex; flex-direction: column; position: relative; overflow: hidden; }
.hdr { height: 64px; background: var(--g3); color: #fff; display: flex; align-items: center; gap: 18px; padding: 0 24px; position: relative; z-index: 20; flex: none; }

.hdr .sp { flex: 1; }
.qnum { font-size: 13px; color: #CFE6DA; white-space: nowrap; }

.mode { display: inline-flex; border: 1px solid #fff; border-radius: 999px; overflow: hidden; flex: none; }

.steps span.on { background: var(--g); color: #fff; border-color: var(--g); }
.steps span.done { color: var(--g); border-color: var(--m1); background: var(--m2); }
.ws { position: relative; flex: 1; min-height: 0; overflow: hidden; }
#chat { position: absolute; top: 20px; bottom: 20px; transition: left .5s cubic-bezier(.2,.8,.2,1), width .5s cubic-bezier(.2,.8,.2,1); z-index: 2; }
.welcome { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 0 6px; }
.welcome .avatar { width: 84px; height: 92px; }
.welcome h2 { margin: 10px 0 2px; font-weight: 300; color: var(--g); font-size: 30px; }

.form-stage { position: absolute; top: 20px; bottom: 20px; display: flex; justify-content: center; align-items: flex-start; z-index: 3; }

/* left rail opens the dossier */
.rail { position: absolute; z-index: 30; left: 0; top: 0; bottom: 0; width: 72px; border: 0; background: #fff; color: var(--g); box-shadow: 1px 0 0 var(--line-3); display: flex; flex-direction: column; align-items: center; padding: 18px 0; gap: 18px; font-size: 10.5px; font-weight: 600; }

.rail[aria-expanded="true"] .rail-i:first-child { color: var(--g); }
.dossier { position: absolute; z-index: 40; left: 72px; top: 0; bottom: 0; width: min(390px, 85vw); background: #fff; display: flex; flex-direction: column; box-shadow: 10px 0 40px rgba(0,0,0,.15); visibility: hidden; }
.dossier.open { visibility: visible; }
.dhead { padding: 18px 20px 0; display: flex; align-items: center; gap: 10px; position: relative; }

.dtabs { display: flex; gap: 4px; padding: 10px 20px 0; border-bottom: 1px solid var(--line-3); }

.dtabs .num:empty { display: none; }
.dtabs button.ping { animation: ping 1.2s ease-out; }
@keyframes ping { 0% { background: var(--m2); } 100% { background: transparent; } }
.dbody { flex: 1; overflow-y: auto; padding: 14px 20px 24px; }
.d-item { margin-bottom: 14px; }
.meter { height: 8px; background: var(--line-3); border-radius: 8px; overflow: hidden; margin: 6px 0 4px; }
.meter i { display: block; height: 100%; background: var(--g); width: 0; transition: width .6s; border-radius: 8px; }
.signal { background: var(--m3); border-left: 4px solid var(--g); padding: 8px 10px; font-size: 13px; margin-bottom: 6px; border-radius: 0 8px 8px 0; }
.signal.flag { background: var(--warn-soft); border-left-color: #F0A13B; }
.grp h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--g); display: flex; justify-content: space-between; }
.grp h4 span { color: var(--ink-3); font-weight: 500; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line-3); font-size: 13.5px; align-items: baseline; }

.row .k svg { width: 12px; height: 12px; color: var(--g); flex: none; transform: translateY(1px); }
.row .v { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
.row .v.empty { color: var(--line); font-weight: 400; }
.row .v small { display: block; font-size: 10.5px; font-weight: 600; color: var(--g); text-transform: uppercase; letter-spacing: .04em; }

.row.flash { animation: rowflash 1.6s ease-out; }

.q-card { border: 1px solid var(--line-2); border-radius: 12px; padding: 12px; font-size: 13px; margin-bottom: 10px; }

.q-top { display: flex; justify-content: space-between; font-weight: 700; }

.tip { position: fixed; z-index: 100; max-width: 260px; background: #1F1F1F; color: #fff; font-size: 12.5px; line-height: 1.45; padding: 8px 11px; border-radius: 6px; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.25); animation: msg-in .15s ease-out; }
.tip b { display: block; margin-bottom: 2px; }

/* full form mode: the whole quote as one prefilled A2UI surface */

.meters b { color: var(--ink); }
.trace-head .sp { flex: 1; }
.trace-list { flex: 1; overflow-y: auto; padding: 6px 10px 16px; font-size: 12px; }
.tr-head { display: grid; grid-template-columns: 60px 190px 1fr; gap: 8px; width: 100%; text-align: left; background: none; border: 0; padding: 4px 6px; border-radius: 6px; align-items: center; }
.tr-head:hover, .tr-head.open { background: var(--m4); }
.tr-head.nodetail { cursor: default; }
.tr-t { font: 11px var(--mono); color: var(--ink-3); }
.tr-type { font: 600 11px var(--mono); padding: 1px 7px; border-radius: 5px; width: fit-content; background: var(--gray); color: var(--ink-2); }
.t-model { background: var(--info-soft); color: var(--info); } .t-tool { background: var(--slate-soft); color: var(--slate); } .t-a2ui { background: var(--m2); color: var(--g2); }
.t-state { background: var(--violet-soft); color: var(--violet); } .t-confirm, .t-warn, .t-rules { background: var(--warn-soft); color: var(--warn); } .t-db { background: var(--gray); color: var(--ink-2); }
.t-turn { background: var(--ink); color: #fff; } .t-guard { background: var(--danger-soft); color: var(--danger); }
.tr-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.trace-list pre.json { margin: 4px 0 8px 68px; max-height: 280px; }

/* ---------- phone preview (demo only): the same page inside a phone frame ---------- */
body.dev-phone .app { display: none; }
.phones { height: calc(100vh - 44px); display: flex; align-items: center; justify-content: center; gap: 40px; padding: 16px 24px; background: radial-gradient(ellipse at 50% 30%, #F4F8F6, #DDE6E1); overflow: hidden; }

<script>
/* a2ui.js
 * 1. Simulated A2UI MCP server: compiles an agent FormSpec into A2UI 1.0 messages using the
 *    state catalog. A form opens with ONE createSurface that carries both components and dataModel.
 *    Bindings use {"@path"}, validation uses "@checks" CheckRules ({condition: {"@call"...}, message}),
 *    headings are Markdown in Text, buttons have a Text child and action.event.
 * 2. A2UI renderer: applies 1.0 messages and renders the basic catalog components it needs plus the
 *    insurance catalog (YmmPicker, VinField, AddressLookup, Repeater, AssignmentMatrix, OfferCards,
 *    Summary, FileDrop, InPlaceNote, ActionBar). Field lookups and document reads leave the renderer as
 *    callAgentFunction and come back as agentFunctionResponse (no model call).
 * 3. Stage: the "ball from the bot icon expands into the form" animation and its reverse.
 * 4. Fake services standing in for the quoting MCP tools and the document agent.
 * Everything is local. No network calls.
 */
(function (G) {
  'use strict';
  const CAT = G.STATE_CATALOG;
  const FIELD = Object.fromEntries(CAT.fields.map((f) => [f.key, f]));
  /* Language of the customer UI. fr (Desjardins demo) uses label_fr, help_fr and enum_fr from the catalog. */
  const LANG = String(G.A2UI_LANG || (typeof document !== 'undefined' && document.documentElement.lang) || 'fr').slice(0, 2);
  const FR = LANG === 'fr';
  const L = (fr, en) => (FR ? fr : en);
  const flabel = (def) => (def ? (FR && def.label_fr) || def.label || '' : '');
  const fhelp = (def) => (def ? (FR && def.help_fr) || def.help || '' : '');
  const fenum = (def) => (def ? (FR && def.enum_fr) || def.enum || null : null);
  const ENTITY_BASE = { quote: '/quote', vehicle: '/vehicles', driver: '/drivers', underwriting: '/underwriting', household: '/household' };
  const MANY = { vehicle: true, driver: true };
  const A2UI_VERSION = '1.0';
  const BASIC_CATALOG_ID = 'https://a2ui.org/specification/v1_0/catalogs/basic/catalog.json';
  /* Custom catalog (protocolVersion 1.0). It re-exports the basic components used here and adds the
     insurance components and functions. The URL is a placeholder for where the team would publish it. */
  const CATALOG_ID = 'https://catalog.example.com/insurance-catalog/v1/catalog.json';
  const YEAR = new Date().getFullYear();
  const reduceMotion = () => G.matchMedia && G.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#0b6e5f';

  /* ------------------------------------------------------------------ utils */
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const md = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  function ptrParts(p) { return p === '/' || p === '' ? [] : p.split('/').slice(1).map((x) => x.replace(/~1/g, '/').replace(/~0/g, '~')); }
  const ptrEsc = (k) => String(k).replace(/~/g, '~0').replace(/\//g, '~1');
  /* Provenance of a bound value lives in the data model next to it, so the BFF can update it with a
     normal updateDataModel: /_provenance/<escaped pointer> = { source, note }. */
  const provPath = (path) => '/_provenance/' + ptrEsc(path);
  function ptrDel(o, p) { const parts = ptrParts(p); let c = o; for (let i = 0; i < parts.length - 1; i++) { if (c == null) return; c = c[parts[i]]; } if (c != null) { if (Array.isArray(c)) c[parts[parts.length - 1]] = undefined; else delete c[parts[parts.length - 1]]; } }
  function ptrGet(o, p) { let c = o; for (const k of ptrParts(p)) { if (c == null) return undefined; c = c[k]; } return c; }
  function ptrSet(o, p, v) {
    const parts = ptrParts(p); let c = o;
    parts.forEach((k, i) => {
      if (i === parts.length - 1) { c[k] = v; return; }
      if (c[k] == null) c[k] = /^\d+$/.test(parts[i + 1]) ? [] : {};
      c = c[k];
    });
  }
  const keyOf = (path) => { const p = ptrParts(path); return p[p.length - 1]; };
  const parentOf = (path) => path.slice(0, path.lastIndexOf('/')) || '/';
  const clone = (o) => (o === undefined ? undefined : JSON.parse(JSON.stringify(o)));
  function entityPath(entity, index) { return MANY[entity] ? `${ENTITY_BASE[entity]}/${index || 0}` : ENTITY_BASE[entity]; }
  function resolvePath(key, specEntity) {
    if (!key) return null;
    if (key.startsWith('/')) return key;

  function fmtMoney(n, cents) { if (n == null || n === '') return ''; const o = { minimumFractionDigits: cents ? 2 : 0, maximumFractionDigits: cents ? 2 : 0 }; return FR ? Number(n).toLocaleString('fr-CA', o) + '\u00a0$' : '$' + Number(n).toLocaleString('en-CA', o); }
  function labelFor(key, value) {

    if (value === false) return L('Non', 'No');
    if (value == null || value === '') return '';
    const en = fenum(def);
    if (en) {
      if (Array.isArray(value)) return value.map((v) => (en.find((e) => e[0] === v) || [v, v])[1]).join(', ');
      const e = en.find((x) => x[0] === String(value));
      if (e) return e[1];
    }
    if (def && def.type === 'date' && FR && /^\d{4}-\d{2}-\d{2}$/.test(String(value))) { const [y, m, d] = String(value).split('-'); return `${Number(d)} ${['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'][Number(m) - 1]} ${y}`; }
    if (def && def.type === 'currency') return fmtMoney(value);
    if (def && def.type === 'integer' && key === 'annual_kilometers') return Number(value).toLocaleString(FR ? 'fr-CA' : 'en-CA') + ' km';
    if (Array.isArray(value)) return value.length + L(' élément', ' item') + (value.length === 1 ? '' : 's');
    if (typeof value === 'object') return JSON.stringify(value);
    return String(value);
  }

  /* ---------------------------------- end-of-form rules (mirror of bff/rules/end_of_form.py) */

  const EXOTIC = ['lamborghini', 'ferrari', 'mclaren', 'bugatti', 'rolls-royce', 'bentley', 'aston martin'];

    { id: 'USAGE_AGRICOLE', severity: 'STOP', reason: 'Les véhicules à usage agricole sont assurés par notre équipe d’assurance agricole. Un conseiller spécialisé prendra le relais.', match: () => eachVehicle((i) => (val(VP(i, 'usage_type')) === 'farm' ? VP(i, 'usage_type') : null)) },

    { id: 'JEUNE_CONDUCTEUR_PRINCIPAL', severity: 'FLAG', reason: 'Un conducteur de moins de 25 ans est conducteur principal : le conseiller vérifiera les rabais pour jeunes conducteurs.', match: () => (val('/household/driver_vehicle_assignments') || []).filter((a) => a.role === 'principal' && (ageOf(a.driver_index) ?? 99) < 25).map(() => '/household/driver_vehicle_assignments') }

  /* ----------------------------------------------------- memory agent (sim) */

  const MAKES = { Toyota: ['RAV4', 'Corolla', 'Camry', 'Highlander', 'Sienna'], Honda: ['Civic', 'CR-V', 'Accord', 'Odyssey'], Ford: ['F-150', 'Escape', 'Mustang'], Hyundai: ['Elantra', 'Tucson', 'Kona', 'Ioniq 5'], Kia: ['Forte', 'Sportage', 'Soul'], Mazda: ['Mazda3', 'CX-5', 'CX-30'], Subaru: ['Outback', 'Forester', 'Crosstrek'], Tesla: ['Model 3', 'Model Y'], Chevrolet: ['Equinox', 'Silverado', 'Bolt EV'], Volkswagen: ['Jetta', 'Golf', 'Tiguan'], Nissan: ['Rogue', 'Sentra', 'Leaf'], Lamborghini: ['Huracán', 'Urus'] };

  async function finAction(sf, name) {
    if (name === 'dismiss' || name === 'edit') { S.ended = false; await closeForm(sf, 'dismissed'); sysNote('Rouvrez un formulaire dans la conversation pour modifier vos réponses. Le résumé sera mis à jour.'); setSugg(['Continuer ma soumission', 'Parler à un conseiller']); return; }
    if (name === 'send') {
      const errs = sf.validate(); if (errs.length) { sf.errSummary.textContent = `${errs.length} champ${errs.length > 1 ? 's' : ''} à corriger`; return; }
      const ref = 'CNS-' + rnd(100000, 999999);
      const contact = { first_name: sf.get('/quote/first_name'), last_name: sf.get('/quote/last_name'), phone_number: sf.get('/quote/phone_number'), email: sf.get('/quote/email') };
      merge(Object.entries(contact).filter(([, v]) => v).map(([k, v]) => ({ path: '/quote/' + k, value: v })), 'form');
      trace('handoff.created', `${ref} · advisor callback with the customer's edited summary`, { type: 'handoff.created', data: { reference: ref, rule_id: (S.lastHit && S.lastHit.rule_id) || null, summary: sf.get('/quote/handoff_summary'), contact: { phone_number: '<redacted in logs>', email: '<redacted in logs>' }, consent_to_transmit: true } });
      cosmos('handoffs', { reference: ref, rule_id: (S.lastHit && S.lastHit.rule_id) || null, status: 'queued' });
      S.sent = true;
      sf.bodyEl.innerHTML = `<div class="done-box"><div class="big">${ICON.ok.replace('width="16" height="16"', 'width="34" height="34"')}</div><h3>C’est envoyé!</h3><p>Référence : <b>${ref}</b></p><p style="color:var(--ink-2)">Un conseiller vous appellera d’ici 1 jour ouvrable au <b>${esc(contact.phone_number || 'numéro fourni')}</b>. Votre résumé lui a été transmis.</p></div>`;
      sf.footEl.innerHTML = ''; const close = h('button', { class: 'btn primary', type: 'button' }, 'Fermer'); sf.footEl.append(h('div', { class: 'spacer' }), close);
      close.onclick = async () => { await closeForm(sf, 'sent'); $$('.form-chip').forEach((c) => { if (c !== sf.chip) { c.disabled = true; c.classList.add('locked'); } }); sysNote('Dossier transmis à un conseiller.'); setSugg([]); };
    }
  }
  const host = {
    services,
    demoFill(sf) {
      trace('demo', `demo fill: sample answers for ${sf.id}`);
      if (sf.sample === 'readAll') { if (sf.readAll) sf.readAll(); return; }
      if (sf.sample === 'board') {
        const steps = []; for (let v = 0; v < nVeh(); v++) steps.push([Math.min(v, nDrv() - 1), v, 'p']);
        for (let p = 0; p < nDrv(); p++) if (p >= nVeh()) steps.push([p, 0, 's']);
        if (nDrv() > 1 && nVeh() > 1) steps.push([1, 0, 's']);
        steps.forEach(([p, v, k], i) => setTimeout(() => sf.placeOnBoard && sf.placeOnBoard(p, v, k), i * 260));
        return;
      }
      for (const [p, v] of Object.entries(sf.sample || {})) A.ptrSet(sf.data, p, v);
      S.quietSvc = true; sf.rerender(); S.quietSvc = false;
    },
    onChange() {},
    async onFieldAction(sf, a) {
      if (a.kind !== 'document') return null;
      trace('a2ui.callAgentFunction', `extractDocument ← ${sf.id}`, { version: '1.0', callAgentFunction: { surfaceId: sf.id, functionCallId: 'fc_' + (++fcSeq), callFunction: { '@call': 'extractDocument', catalogId: A.CATALOG_ID, args: { purpose: a.purpose, file: '<blob ref, stored in Blob Storage>' } } } });
      trace('document.agent', `BFF → document agent (Foundry prompt agent, gpt-5.6-luna, structured output) · ${a.purpose}`, { agent: 'document-agent', model: 'gpt-5.6-luna', response_format: 'DocumentExtraction (strict)', counted_in_turn: false });
      await wait(rnd(1100, 1500));
      const r = services.extractDocument(a.purpose);
      trace('a2ui.agentFunctionResponse', `extractDocument → ${sf.id} (${Object.keys(r.fields || {}).length} fields)`, { version: '1.0', agentFunctionResponse: { value: r } });
      if (!S.docsRead.includes(a.purpose)) S.docsRead.push(a.purpose);
      return r;
    },
    onAction(sf, name, payload) {
      trace('a2ui.action', `${sf.id} · ${name}${sf.edit ? ' (edit mode)' : ''}`, { version: '1.0', action: { surfaceId: sf.id, name, context: payload && payload.values ? { values: payload.values } : {} } });
      if (sf.id === 'full_form') return fullFormAction(sf, name, payload);
      if (sf.id === 'fin_conseiller') return finAction(sf, name);
      if (S.busy) return;
      if (name === 'dismiss') { closeForm(sf, 'dismissed').then(() => { if (!sf.edit) { sysNote('Formulaire fermé. Vous pouvez répondre ici, ou le rouvrir depuis la conversation.'); setSugg(['Continuer ma soumission']); } }); return; }
      if (name === 'nodocs') { closeForm(sf, 'dismissed').then(() => send('Continuer sans documents')); return; }
      if (sf.edit) { saveEdit(sf, payload.values); return; }
      const changes = toChanges(sf, payload.values);
      closeForm(sf, 'submitted').then(() => runTurn({ kind: 'form_submitted', surface_id: sf.id, chip: sf.chipLabel, changes }));
    }
  };

  /* ---------------------------------------- full form mode (D20): one long prefilled surface */
  let fullSf = null;
  function specFull() {
    const nr = { required: false };
    const fields = [{ widget: 'section', label: 'Vous' }, fld('/quote/first_name', nr), fld('/quote/last_name', nr), fld('/quote/date_of_birth', nr), fld('/quote/email', nr), fld('/quote/phone_number', nr)];
    for (let i = 0; i < Math.max(1, nVeh()); i++) fields.push({ widget: 'section', label: `Véhicule ${i + 1}` }, { key: VP(i, 'vehicle_year'), widget: 'ymm', required: i < nVeh() && has(VP(i, 'vehicle_make')), prefill: ymmPrefill(i) }, fld(VP(i, 'usage_type'), { widget: 'chips', required: false }));
    fields.push({ widget: 'section', label: 'Autres conducteurs' }, driversRepeater());
    fields.push({ widget: 'section', label: 'Antécédents' }, fld('/underwriting/has_claims', { widget: 'toggle', required: false }), fld('/underwriting/has_convictions_in_past_three_years', { widget: 'toggle', required: false }), fld('/underwriting/was_denied_or_cancelled', { widget: 'toggle', required: false }));
    return { form_id: 'full_form', title: 'Votre soumission complète', layout: 'two_column', entity: { type: 'quote' }, actions: [{ id: 'back', label: 'Retour à la conversation', style: 'secondary' }, { id: 'submit', label: 'Enregistrer et continuer', style: 'primary' }], fields };
  }
  function setMode(m) {
    if (m === 'form' && (S.busy || S.sent)) return;
    S.mode = m;
    $('#m-chat').setAttribute('aria-pressed', String(m === 'chat')); $('#m-form').setAttribute('aria-pressed', String(m === 'form'));
    const ff = $('#fullform');
    if (m === 'form') {
      const spec = specFull();
      trace('ui.surface_reopen', 'client → BFF: full form (reserved id full_form)', { type: 'ui.surface_reopen', data: { surface_id: 'full_form', mode: 'edit' } });
      const msgs = A.compile(spec);
      fullSf = new A.Surface(spec.form_id, host); fullSf.sample = {};
      for (const msg of msgs) { trace('a2ui.message', `createSurface → ${spec.form_id} (full form, prefilled with ${countFilled()} known values) · rendered by the BFF, no model call`, msg); fullSf.apply(msg); }
      S.quietSvc = true; const card = fullSf.render(); S.quietSvc = false;
      ff.innerHTML = '<div class="inner"><h1>Votre soumission</h1><p class="lead">Tout ce que vous avez dit ou téléversé est déjà rempli. Les champs « Tiré de la conversation » sont à vérifier.</p></div>';
      $('.inner', ff).append(card); ff.hidden = false;
      if (!reduce()) { ff.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], { duration: 320, easing: 'cubic-bezier(.2,.8,.2,1)' }); $$('.a2-col > *', card).forEach((c, i) => c.animate([{ opacity: 0, transform: 'translateY(10px)' }, { opacity: 1, transform: 'none' }], { duration: 300, delay: 60 + Math.min(i, 14) * 40, fill: 'backwards' })); }
    } else if (!ff.hidden) {
      ff.animate([{ opacity: 1 }, { opacity: 0 }], { duration: reduce() ? 1 : 180 }).finished.then(() => { if (S.mode === 'chat') { ff.hidden = true; ff.innerHTML = ''; fullSf = null; } });
    }
  }
  async function fullFormAction(sf, name, payload) {
    if (name === 'back' || name === 'dismiss') { setMode('chat'); return; }
    if (name !== 'submit') return;
    const changes = toChanges(sf, payload.values);
    for (const c of changes) { const m = c.path.match(/^\/vehicles\/(\d+)\//); if (m) while (nVeh() <= Number(m[1])) S.state.vehicles.push({}); }
    const pend = merge(changes, 'form');
    if (pend.length) await confirmDeterministic(pend, 'Vous avez répondu dans le formulaire complet.');
    if (nDrv() > 1) S.asked.drivers = true;
    setMode('chat'); sysNote('Formulaire complet enregistré. Votre dossier est à jour.');
    S.historyTokens += 20; trace('history.note', 'system note appended to history for the next turn (no model call now)', { role: 'system', content: `Customer saved the full form (${changes.length} values)` });
    await handleStopOutsideTurn();
    if (!S.ended && !S.busy) setSugg(['Continuer ma soumission']);
  }

  /* -------------------------------------------------------------- layout */
  let stageBottom = 0;
  function layout(open) {
    const ws = $('#ws'); const W = ws.clientWidth; const chat = $('#chat'); const st = $('#stage');
    document.body.classList.toggle('form-open', !!open);
    if (isPhone()) {
      /* phone: the conversation slides left under the form; suggestions and the composer stay usable below it */
      chat.style.left = '0px'; chat.style.width = W + 'px';
      chat.classList.toggle('pushed', !!open);
      if (open) { const cr = chat.getBoundingClientRect(), wr = ws.getBoundingClientRect(); stageBottom = Math.round(wr.bottom - cr.bottom) + $('#sugg').offsetHeight + $('.composer').offsetHeight + 2; st.style.left = '8px'; st.style.width = (W - 16) + 'px'; st.style.bottom = stageBottom + 'px'; st.hidden = false; }
      else { st.hidden = true; hidePeek(); }
      setTimeout(down, 520); return;
    }
    chat.classList.remove('pushed'); st.style.bottom = '';
    const left0 = 72, pad = 20, avail = W - left0, narrow = avail < 820;
    const cw = open ? (narrow ? avail - 2 * pad : Math.max(340, Math.min(440, Math.round(avail * 0.36)))) : Math.min(720, avail - 2 * pad);
    const cl = open ? left0 + pad : left0 + Math.round((avail - cw) / 2);
    chat.style.width = cw + 'px'; chat.style.left = cl + 'px';
    if (open) { const sl = narrow ? left0 + pad : cl + cw + 24; st.style.left = sl + 'px'; st.style.width = (W - sl - pad) + 'px'; st.hidden = false; } else st.hidden = true;
    setTimeout(down, 520);
  }
  const stage = new A.Stage({
    stageEl: $('#stage'),
    anchor: () => (S.openerAvatar && S.openerAvatar.isConnected ? S.openerAvatar : $$('#scroll .msg.bot .avatar').pop()),
    layout: (open) => layout(open), layoutMs: 500, autofocus: !isPhone(),
    onCloseStart: () => { if (isPhone()) { $('#chat').classList.remove('pushed'); hidePeek(); } },
    anchorShift: () => (isPhone() ? { x: new DOMMatrix(getComputedStyle(scroller()).transform).m41 } : { x: 0 })
  });

  /* --------------------------------------------------------------- boot */
  async function greet() {
    S.busy = true; setComposer(false);
    const sh = botShell();
    trace('ui.greeting', 'static greeting rendered by the BFF, no model call', { type: 'assistant.message', data: { template: 'greeting.fr-CA' } });
    await streamInto(sh, 'Bonjour! Je suis votre conseiller virtuel Desjardins Assurances. Je prépare votre soumission auto avec vous, surtout en conversation, avec de courts formulaires au besoin.\n\nQue souhaitez-vous faire?', null, 500);
    S.busy = false; setComposer(true);
    const v = validateSuggestions(SUGG.greet); setSugg(v.kept);
  }
  function send(text) { const t = (text != null ? text : $('#input').value).trim(); if (!t || S.busy) return; if (text == null) $('#input').value = ''; setSugg([]); runTurn({ kind: 'message', text: t }); }
  function reset() {
    $$('.morph,.modal-back,.tip,.dragghost').forEach((e) => e.remove());
    fresh(); T0 = now(); dOpen = false; $('#dossier').classList.remove('open'); $('#dtab').setAttribute('aria-expanded', 'false');
    stage.current = null; stage.busy = Promise.resolve();
    $('#scroll').innerHTML = `<div class="welcome"><span class="avatar">${ICON.botface}</span><h2>Bonjour!</h2><p>Je suis votre conseiller virtuel Desjardins Assurances.</p></div>`;
    $('#stage').innerHTML = ''; S.mode = 'form'; setMode('chat'); $('#fullform').hidden = true; $('#fullform').innerHTML = '';
    $('#qnum').textContent = S.quoteNo; selectTab('states');
    const tl = traceList(); if (tl) tl.innerHTML = ''; const tc = $('#trace-count'); if (tc) tc.textContent = ''; resetMeters();
    setSugg([]); renderStates(); renderQuotes(); updateProgress(); layout(false); greet();
  }

  /* --------------------------------- demo controls: trace, device, replay, end-of-form rule */
  const SB_ICONS = '<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 11.5 10.6 8.6a3.7 3.7 0 0 0-5.2 0z"/><path d="M8 4.8c1.9 0 3.6.7 4.9 1.9l1.4-1.5A8.9 8.9 0 0 0 8 2.6 8.9 8.9 0 0 0 1.7 5.2l1.4 1.5A7 7 0 0 1 8 4.8z"/></svg><svg width="26" height="12" viewBox="0 0 26 12"><rect x=".5" y=".5" width="22" height="11" rx="3" fill="none" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="17" height="8" rx="1.8"/><rect x="23.6" y="4" width="1.6" height="4" rx=".8" opacity=".45"/></svg>';
  let device = 'desktop';
  const frame = () => $('#phones iframe');
  function fitPhones() {
    const box = $('#phones'); if (!box || box.hidden) return; const p = $('.phone', box); if (!p) return;
    const k = Math.min(1, (box.clientHeight - 64) / 868, (box.clientWidth - 48) / 414);
    const hold = $('.holder', p); hold.style.width = Math.floor(414 * k) + 'px'; hold.style.height = Math.floor(868 * k) + 'px'; $('.frame', p).style.transform = `scale(${k})`;
  }
  function setDevice(d) {
    device = d; document.body.classList.toggle('dev-phone', d === 'phone'); $('#phones').hidden = d !== 'phone';
    $$('#dseg button').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.d === d)));
    const tl = traceList(); if (tl) tl.innerHTML = ''; resetMeters(); T0 = now();
    if (d === 'phone') {
      const box = $('#phones'); box.innerHTML = '';
      const p = h('figure', { class: 'phone' }, `<div class="holder"><div class="frame"><div class="screen"><iframe title="Soumission auto sur téléphone"></iframe></div><div class="sb"><b>9:41</b><span>${SB_ICONS}</span></div><i class="island"></i><i class="home"></i></div></div><figcaption>Variation C sur téléphone (390 × 844)</figcaption>`);
      box.append(p); $('iframe', p).srcdoc = SRC_HTML.replace('<html', '<html data-embed="phone"'); fitPhones();
    } else { $('#phones').innerHTML = ''; reset(); }
  }
  function toggleTrace(force) {
    const open = force != null ? force : !$('#trace').classList.contains('open');
    $('#trace').classList.toggle('open', open); document.body.classList.toggle('dev', open); document.body.classList.toggle('trace-open', open);
    $('#btn-trace').setAttribute('aria-pressed', String(open)); setTimeout(fitPhones, 320);
  }
  function lambo() {
    if (S.busy || S.ended || S.sent) return;
    if (!has('/quote/contact_consent')) { trace('demo', 'demo shortcut: consent recorded so the rule demo can start'); commit('/quote/contact_consent', true, 'confirmed', 1); S.asked.docs = true; S.phase = 'gather'; renderStates(); }
    if (!['vehicle', 'second_vehicle', 'second_which'].includes(S.topic)) topic('vehicle');
    send('Je conduis une Lamborghini Huracán 2023');
  }

  /* --------------------------------------------------------------- wiring */
  $('#brand-mark').innerHTML = ICON.brand;
  $('#send').onclick = () => send();
  $('#input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  $('#dtab').onclick = () => togglePanel();
  $('#dclose').onclick = () => togglePanel(false);
  $$('.dtabs button').forEach((b) => { b.onclick = () => selectTab(b.dataset.tab); });
  $('#m-chat').onclick = () => setMode('chat');
  $('#m-form').onclick = () => setMode('form');
  $('#h-agent').onclick = () => { if (!S.busy && !S.ended && !S.sent) send('Parler à un conseiller'); };
  $('#btn-trace').onclick = () => toggleTrace();
  $('#trace-close').onclick = () => toggleTrace(false);
  $('#btn-reset').onclick = () => { if (device === 'phone') { const f = frame(); if (f) f.contentWindow.postMessage({ proto: 'reset' }, '*'); const tl = traceList(); if (tl) tl.innerHTML = ''; resetMeters(); T0 = now(); } else reset(); };
  $('#lambo').onclick = () => { if (device === 'phone') { const f = frame(); if (f) f.contentWindow.postMessage({ proto: 'lambo' }, '*'); } else lambo(); };
  $$('#dseg button').forEach((b) => { b.onclick = () => { if (b.dataset.d !== device) setDevice(b.dataset.d); }; });
  addEventListener('message', (e) => {
    const d = e.data; if (!d || !d.proto) return;
    if (EMBED && e.source === parent) { if (d.proto === 'reset') reset(); if (d.proto === 'lambo') lambo(); return; }
    if (!EMBED && frame() && e.source === frame().contentWindow) { if (d.proto === 'trace') traceRow(d.type, d.label, d.detail, d.cls, d.ms); if (d.proto === 'meters') { const el = $('#meters'); if (el) el.innerHTML = d.html; } }
  });
  addEventListener('resize', () => { layout(!!$('#stage .form-card')); fitPhones(); });
  new ResizeObserver(() => { if (isPhone() && $('#stage .form-card')) layout(true); }).observe($('#sugg'));
  reset();
  if (!EMBED && /phone/.test(location.hash)) setDevice('phone');
  G.__journey = { get S() { return S; }, runTurn, send, checkRules, togglePanel, setMode, setDevice, toggleTrace, reset, lambo };
})(window);

</script>
