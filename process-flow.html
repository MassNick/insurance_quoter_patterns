<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quote Journey Flow</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --fg: #1d2330; --muted: #5d6677; --line: #d9dee7;
  --lane-a: #ffffff; --lane-b: #f1f4f8; --lane-label: #e8edf4; --phase: #e3e9f3; --phase-fg: #2b3a55;
  --task: #f4f1ff; --task-stroke: #7a5cf0; --user: #eef6ff; --user-stroke: #2f7fe0;
  --service: #ecfaf6; --service-stroke: #13987a; --db: #fff7e8; --db-stroke: #c98512;
  --gw: #fffbe6; --gw-stroke: #b38a00; --ev-start: #2e9d58; --ev-end: #c2413a; --ev-mid: #2f7fe0;
  --edge: #6b7486; --edge-data: #c98512; --label-bg: #f6f7f9;
  --chip-tool: #dff3ec; --chip-tool-fg: #0d6b55; --chip-a2ui: #ebe5ff; --chip-a2ui-fg: #4b33b8;
  --llm: #7a5cf0; --llm-fg: #ffffff; --sel: #ff7a1a; --focus: #2f7fe0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11141a; --panel: #181c24; --fg: #e6e9ef; --muted: #9aa3b4; --line: #2b3240;
    --lane-a: #151920; --lane-b: #191e27; --lane-label: #1e2430; --phase: #232b3a; --phase-fg: #c9d4ea;
    --task: #241f3d; --task-stroke: #9d86ff; --user: #16263b; --user-stroke: #5aa2ff;
    --service: #12302a; --service-stroke: #3cc7a4; --db: #33280f; --db-stroke: #e0a73d;
    --gw: #2f2a12; --gw-stroke: #e0c04d; --ev-start: #4cc07a; --ev-end: #ef6b63; --ev-mid: #5aa2ff;
    --edge: #8b94a7; --edge-data: #e0a73d; --label-bg: #11141a;
    --chip-tool: #133a30; --chip-tool-fg: #7fe0c4; --chip-a2ui: #2a2350; --chip-a2ui-fg: #c3b6ff;
    --llm: #9d86ff; --llm-fg: #11141a; --sel: #ff9a4d; --focus: #5aa2ff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 16px 20px 10px; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-end; justify-content: space-between; }
header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
header .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.stats { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; }
.stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 0 20px 10px; }
.toolbar input[type=search] { min-width: 260px; flex: 1 1 260px; max-width: 420px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--fg); font: inherit; }
.toolbar button { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
.toolbar button:hover { border-color: var(--focus); }
.toolbar button:focus-visible, .toolbar input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.zoomval { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; padding: 0 20px 12px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.scroller { overflow: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--lane-a); max-height: calc(100vh - 170px); min-height: 360px; }
.canvas { display: flex; width: max-content; }
.lanelabels { position: sticky; left: 0; z-index: 3; flex: 0 0 auto; width: 156px; background: var(--lane-label); border-right: 1px solid var(--line); }
.lanelabels div { display: flex; align-items: center; padding: 0 12px; font-weight: 600; font-size: 12.5px; border-bottom: 1px solid var(--line); line-height: 1.25; }
.lanelabels .ph { font-weight: 600; color: var(--phase-fg); background: var(--phase); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
svg text { fill: var(--fg); }
.node { cursor: pointer; }
.node:focus { outline: none; }
.node:focus-visible .shape, .node.sel .shape { stroke: var(--sel) !important; stroke-width: 3 !important; }
.dim { opacity: .18; }
.edge path { fill: none; stroke: var(--edge); stroke-width: 1.4; }
.edge.data path { stroke: var(--edge-data); stroke-dasharray: 5 4; }
.edge.loop path { stroke-dasharray: 2 3; }
.edge.hl path { stroke: var(--sel); stroke-width: 2.4; }
.edge text { font-size: 10px; fill: var(--muted); }
.edge rect { fill: var(--label-bg); }
.chip text { font-size: 9.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.chip.tool rect { fill: var(--chip-tool); } .chip.tool text { fill: var(--chip-tool-fg); }
.chip.a2ui rect { fill: var(--chip-a2ui); } .chip.a2ui text { fill: var(--chip-a2ui-fg); }
.chip.more text { fill: var(--muted); }
#details { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 24px rgba(0,0,0,.12); transform: translateX(105%); transition: transform .22s ease; z-index: 10; overflow: auto; padding: 18px 20px 28px; }
#details.open { transform: translateX(0); }
#details h2 { font-size: 17px; margin: 4px 0 2px; }
#details .meta { color: var(--muted); font-size: 12.5px; }
#details dl { margin: 14px 0 0; }
#details dt { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 12px; }
#details dd { margin: 4px 0 0; }
#details code, td code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--lane-b); padding: 1px 5px; border-radius: 4px; display: inline-block; margin: 1px 2px 1px 0; word-break: break-all; }
#details .close { position: absolute; top: 12px; right: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 4px 9px; cursor: pointer; font: inherit; }
#details .nav { display: flex; gap: 8px; margin-top: 18px; }
#details .nav button { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 5px 10px; cursor: pointer; font: inherit; }
section.tablewrap { padding: 16px 20px 40px; }
section.tablewrap summary { cursor: pointer; font-weight: 600; font-size: 15px; }
table { border-collapse: collapse; width: 100%; margin-top: 12px; font-size: 12.5px; background: var(--panel); }
th, td { border: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
th { background: var(--lane-label); position: sticky; top: 0; }
td.id { white-space: nowrap; font-weight: 600; }
tr:hover td { background: var(--lane-b); cursor: pointer; }
.none { color: var(--muted); }
@media (max-width: 640px) {
  header { padding: 12px 16px 8px; } .toolbar, .legend { padding-left: 16px; padding-right: 16px; }
  .lanelabels { width: 104px; } .lanelabels div { font-size: 11px; padding: 0 8px; }
  section.tablewrap { padding: 12px 16px 32px; overflow-x: auto; }
}
@media (prefers-reduced-motion: reduce) { #details { transition: none; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Auto quote journey: BPMN-style process flow</h1>
    <div class="sub">Design artifact · Azure AI Foundry hosted agent, A2UI over MCP · decisions D1–D20 · updated after the first dev deploy (2026-11-25) · static page, no live calls</div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<div class="toolbar">
  <input type="search" id="q" placeholder="Highlight a tool, A2UI message, state path or event (e.g. render_form, /drivers, confirm.required)" aria-label="Highlight steps">
  <button id="zout" title="Zoom out" aria-label="Zoom out">−</button>
  <span class="zoomval" id="zval">100%</span>
  <button id="zin" title="Zoom in" aria-label="Zoom in">+</button>
  <button id="zfit" title="Fit lanes to the window height">Fit height</button>
  <button id="z100">100%</button>
</div>
<div class="legend" id="legend"></div>
<div class="scroller" id="scroller">
  <div class="canvas" id="canvas">
    <div class="lanelabels" id="lanelabels"></div>
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Swimlane process diagram"></svg>
  </div>
</div>
<section class="tablewrap">
  <details open>
    <summary>Every step: tool calls, A2UI calls, state and events</summary>
    <div style="overflow-x:auto"><table id="table"></table></div>
  </details>
</section>
<aside id="details" aria-live="polite" aria-label="Step details"></aside>

<script>
const FLOW = /* <flow-data> */ {
  "title": "Auto quote journey",
  "lanes": [
    {"id": "customer", "label": "Customer"},
    {"id": "frontend", "label": "Frontend (React + A2UI renderer)"},
    {"id": "bff", "label": "BFF (FastAPI, Container Apps)"},
    {"id": "main", "label": "Hosted agent: Main agent (gpt-5.6-terra)"},
    {"id": "memory", "label": "Hosted agent: Memory agent (gpt-5.6-luna)"},
    {"id": "mcp", "label": "Toolbox / MCP servers (quoting, a2ui; Entra app roles)"},
    {"id": "iq", "label": "Foundry IQ"},
    {"id": "doc", "label": "Document agent (gpt-5.6-luna)"},
    {"id": "cosmos", "label": "Cosmos DB"}
  ],
  "phases": [
    {"label": "1 · Intent", "from": 0, "to": 16},
    {"label": "2 · Gather", "from": 17, "to": 85},
    {"label": "3 · Advise", "from": 86, "to": 100},
    {"label": "Event sub-process: off-topic message (any turn)", "from": 102, "to": 106},
    {"label": "Event sub-processes: end-of-form rules (after any commit) and advisor hand-off", "from": 108, "to": 123},
    {"label": "Event sub-process: reopen a form chip or full-form mode (no model call; full form asks consent first)", "from": 125, "to": 136}
  ],
  "nodes": [
    {"id": "P01", "lane": "customer", "col": 0, "type": "start", "name": "Opens the quote page", "what": "Customer lands on the quote page. The session starts anonymous; sign-in with Entra External ID can come later.", "tools": [], "a2ui": [], "state": [], "events": [], "calls": 0},
    {"id": "P02", "lane": "frontend", "col": 1, "type": "task", "name": "Start session, warm up agent", "what": "POST /api/sessions. The page opens in the Variation C shell (D12): dark-green header with the Conversation | Formulaire complet toggle and the Parler à un conseiller button, step chips, a collapsed Votre dossier panel. The BFF also sends input.kind=warmup to the hosted agent (no model call), so the first real turn does not hit 424 session_not_ready.", "tools": [], "a2ui": [], "state": [], "events": [], "calls": 0},
    {"id": "P03", "lane": "bff", "col": 2, "type": "service", "name": "Create session + static greeting", "what": "Creates the state document and returns a templated greeting in French (fr-CA) with generic suggestions. The greeting is not generated by a model.", "tools": [], "a2ui": [], "state": ["/phase = intent"], "events": ["text.done", "suggestions"], "calls": 0},
    {"id": "P04", "lane": "cosmos", "col": 2, "type": "service", "icon": "db", "name": "sessions + events: create", "what": "Inserts the state document (partition key /session_id) and the first rows in events.", "tools": [], "a2ui": [], "state": [], "events": [], "calls": 0},
    {"id": "P05", "lane": "frontend", "col": 3, "type": "user", "name": "Greeting with suggestion bubbles", "what": "Shows the greeting. Suggestions show as bubbles above the composer (D15): Get a quote for my car; Compare with my current insurer; Add a vehicle to my policy; I have a coverage question. (Customer-facing text is French in the product; English here.)", "tools": [], "a2ui": [], "state": [], "events": ["text.done", "suggestions"], "calls": 0},
    {"id": "P06", "lane": "customer", "col": 4, "type": "user", "name": "Clicks 'Get a quote for my car'", "what": "The clicked suggestion is sent as a user message with via=suggestion. The frontend shows the 3 animated dots at once.", "tools": [], "a2ui": [], "state": [], "events": ["user.message"], "calls": 0},
    {"id": "P07", "lane": "bff", "col": 5, "type": "service", "name": "Log input, build turn, invoke agent", "what": "Writes the inbound event, loads state (cache, then Cosmos on a miss), mints a 15-minute session_ref and calls the invocations endpoint with SSE.", "tools": [], "a2ui": [], "state": [], "events": ["turn.started"], "calls": 0},
    {"id": "P08", "lane": "main", "col": 6, "type": "gateway", "variant": "parallel", "name": "Run memory and main together", "what": "The hosted agent loads history (CosmosHistoryProvider, agent_history) and starts both agents with asyncio.gather. Models, thinking level and structured output come from settings.yaml. Content filters sit on the model deployments; on the chat models, sexual content in the customer's input is annotated, not blocked, because the filter rates Québec \"soumission\" (a quote) as sexual (decided 2026-11-25).", "tools": [], "a2ui": [], "state": [], "events": [], "calls": 0},
    {"id": "P09", "lane": "main", "col": 7, "type": "task", "name": "INTENT: confirm goal, ask consent", "what": "Confirms the goal in one sentence and asks for consent to use the customer's information. Ends with suggestions: Yes, I agree; Tell me more first.", "tools": ["ui.set_phase", "ui.suggest_replies"], "a2ui": [], "state": [], "events": ["phase", "text.delta", "text.done", "suggestions"], "calls": 1, "calls_note": "main"},
    {"id": "P10", "lane": "memory", "col": 7, "type": "task", "name": "Extract quote_goal", "what": "Returns MemoryAgentOutput with state_changes and intent.phase_hint=intent. Structured output is non-strict (a change's value is any JSON, which strict mode rejects) and every output is validated against memory-output.schema.json; a failure or the 8 s timeout sends memory.result with an error and the turn goes on.", "tools": [], "a2ui": [], "state": ["/quote/quote_goal = new_quote (chat, inferred, 0.95)"], "events": ["memory.result"], "calls": 1, "calls_note": "memory"},
    {"id": "P11", "lane": "main", "col": 8, "type": "gateway", "variant": "parallel", "name": "Join, save history", "what": "Waits for both agents, appends history, emits turn.completed with model_calls=2 (3 with a narrate round or a corrective completion) and token usage (including cached tokens).", "tools": [], "a2ui": [], "state": [], "events": ["turn.completed"], "calls": 0, "calls_note": "turn total: 2"},
    {"id": "P12", "lane": "bff", "col": 9, "type": "service", "name": "Merge memory result, relay", "what": "Holds the main agent's reply (text, forms, suggestions) until memory.result arrives, so a rule question or a STOP can still drop it. Applies the merge rules in contracts/events.md (a memory result that fails its schema, such as an error, is ignored and logged), runs the end-of-form rules on the commit batch (no hit here), drops any suggestion item that breaks D15 (PII, names, values the customer has not given, over 40 characters), relays text and suggestions, writes the state document, a state_changes row and the events.", "tools": [], "a2ui": [], "state": ["/quote/quote_goal"], "events": ["state.delta", "signals", "turn.completed"], "calls": 0},
    {"id": "P13", "lane": "cosmos", "col": 9, "type": "service", "icon": "db", "name": "sessions, state_changes, events, agent_history", "what": "State document replaced with an _etag check; append-only state_changes row; events rows; agent history saved by the hosted agent identity.", "tools": [], "a2ui": [], "state": [], "events": [], "calls": 0},
    {"id": "P14", "lane": "customer", "col": 10, "type": "user", "name": "Clicks 'Yes, I agree'", "what": "Consent given in chat. Turn 2 runs the same way as P07 to P11.", "tools": [], "a2ui": [], "state": [], "events": ["user.message"], "calls": 0},
    {"id": "P15", "lane": "memory", "col": 11, "type": "task", "name": "Propose contact_consent = true", "what": "The memory agent proposes the consent value. It cannot commit it: the field is deterministic.", "tools": [], "a2ui": [], "state": ["/quote/contact_consent = true (chat, proposed, 0.95)"], "events": ["memory.result"], "calls": 1, "calls_note": "memory"},
    {"id": "P16", "lane": "main", "col": 11, "type": "task", "name": "Acknowledge; do not ask again", "what": "Thanks the customer and says a window will ask them to confirm. The prompt forbids asking for consent a second time, and the reply text goes in the same response as the tool calls (ui.* and a2ui.* end the turn, so text written after them is never shown).", "tools": ["ui.suggest_replies"], "a2ui": [], "state": [], "events": ["text.delta", "text.done", "suggestions"], "calls": 1, "calls_note": "main"},
    {"id": "P17", "lane": "bff", "col": 12, "type": "gateway", "variant": "exclusive", "name": "Deterministic field changed?", "what": "contact_consent is deterministic in the catalog. If it changed, the BFF holds it as pending_confirmation, writes a confirmations row (TTL 900 s) and emits confirm.required. If not (the customer asked to know more), the agent explains and asks again.", "tools": [], "a2ui": [], "state": ["/quote/contact_consent (pending_confirmation)"], "events": ["confirm.required"], "calls": 0},
    {"id": "P18", "lane": "frontend", "col": 13, "type": "user", "name": "Double-confirm popup", "what": "Step 1: plain-language summary of what is shared and why. Step 2: an explicit second confirmation. Closing the popup counts as a refusal.", "tools": [], "a2ui": [], "state": [], "events": ["confirm.response (step 1)", "confirm.response (step 2)"], "calls": 0},
    {"id": "P19", "lane": "customer", "col": 14, "type": "gateway", "variant": "exclusive", "name": "Accepted both steps?", "what": "Both steps must be accepted for the value to commit.", "tools": [], "a2ui": [], "state": [], "events": [], "calls": 0},
    {"id": "P20", "lane": "bff", "col": 15, "type": "service", "name": "Revert; log confirm.rejected", "what": "Drops the pending value and logs confirm.rejected. The next agent turn (input.kind=confirmation_result) explains that a quote needs consent and offers an advisor call.", "tools": [], "a2ui": [], "state": ["/quote/contact_consent reverted to previous value"], "events": ["state.delta", "text.delta", "suggestions"], "calls": 0, "calls_note": "next turn: 2 (main + memory)"},
    {"id": "E1", "lane": "customer", "col": 16, "type": "end", "name": "Ends without consent", "what": "Session kept for 90 days (proposed TTL) so the customer can come back.", "tools": [], "a2ui": [], "state": [], "events": [], "calls": 0},
    {"id": "P21", "lane": "bff", "col": 16, "type": "service", "name": "Commit consent; rule check; invoke agent", "what": "Commits the value with status confirmed and both step timestamps in confirmations. Runs the end-of-form rules on the batch. Invokes the agent with input.kind=confirmation_result, because the confirmation was raised from chat and the agent's last reply waited on it.", "tools": [], "a2ui": [], "state": ["/quote/contact_consent = true (confirmed)"], "events": ["state.delta", "turn.started"], "calls": 0},
    {"id": "P22", "lane": "main", "col": 17, "type": "task", "name": "GATHER: offer documents once", "what": "Sets the phase to gather and thanks the customer for the confirmation in one short sentence. Says once that the customer can answer by text or ask for forms, and never asks them to choose (D14). Offers once to read the driver's licence, registration certificate and current policy to pre-fill (D13). Suggestions: Yes, I have my documents; Only some of them; I don't have them.", "tools": ["ui.set_phase", "ui.suggest_replies"], "a2ui": [], "state": [], "events": ["phase", "text.delta", "suggestions"], "calls": 2, "calls_note": "main + memory (memory not drawn)"},
    {"id": "P23", "lane": "customer", "col": 18, "type": "gateway", "variant": "exclusive", "name": "Read documents?", "what": "Yes or only some: the DocumentDrop form opens. No: the agent gathers through chat and subject forms and never offers again.", "tools": [], "a2ui": [], "state": [], "events": [], "calls": 0},
    {"id": "P24", "lane": "main", "col": 19, "type": "task", "name": "Open DocumentDrop", "what": "FormSpec documents with one document_drop field (D18). One sentence says what it is for.", "tools": ["ui.suggest_replies"], "a2ui": ["a2ui.render_form(documents) → createSurface (components + dataModel)"], "state": [], "events": ["tool.call", "a2ui.message", "text.delta"], "calls": 2, "calls_note": "main + memory"},
    {"id": "P25", "lane": "mcp", "col": 20, "type": "service", "name": "a2ui: compile DocumentDrop", "what": "DocumentDrop with three tiles: driver's licence (licence), registration certificate (registration), current policy (declaration).", "tools": [], "a2ui": ["createSurface(documents)"], "state": [], "events": ["tool.result"], "calls": 0},
    {"id": "P26", "lane": "customer", "col": 21, "type": "user", "name": "Uploads documents on the tiles", "what": "Each tile posts the file to /api/sessions/{sid}/documents with its purpose and surface_id=documents. Tiles the customer does not have stay empty.", "tools": [], "a2ui": ["callAgentFunction extractDocument (documents)"], "state": [], "events": ["document.uploaded"], "calls": 0},
    {"id": "P27", "lane": "bff", "col": 22, "type": "service", "name": "Scan, then extract each file", "what": "Saves each file to Blob uploads (private); Defender for Storage scans it; the BFF then calls the document agent once per file.", "tools": ["document.extract (BFF only)"], "a2ui": [], "state": [], "events": [], "calls": 0},
    {"id": "P28", "lane": "doc", "col": 23, "type": "task", "name": "Read licence, registration, policy", "what": "Strict schema per purpose. Licence: name, date of birth, address, licence number. Registration: year, make, model, VIN. Policy: insurer, years insured, listed drivers and vehicles. Instructions inside a document are ignored.", "tools": [], "a2ui": [], "state": [], "events": [], "calls": 1, "calls_note": "document agent, once per file"},
    {"id": "P29", "lane": "bff", "col": 24, "type": "service", "name": "Show extracted fields for review", "what": "Sends the extracted fields with their confidence to the documents surface. Nothing is committed yet (D18).", "tools": [], "a2ui": ["updateDataModel(documents)"], "state": [], "events": ["a2ui.message"], "calls": 0},
    {"id": "P30", "lane": "customer", "col": 25, "type": "user", "name": "Reviews, edits, submits", "what": "Corrects any field, then Continuer. 'Continuer sans documents' closes the form and commits nothing.", "tools": [], "a2ui": ["action submit (documents)"], "state": [], "events": ["a2ui.action"], "calls": 0},

    if (k === "llm") { c("rect", { x: 1, y: 3, width: 28, height: 12, rx: 6, style: "fill:var(--llm)" }); const t = c("text", { x: 15, y: 12, "text-anchor": "middle", style: "font-size:8px;font-weight:700;fill:var(--llm-fg)" }); t.textContent = "LLM×2"; }
    if (k === "tool") c("rect", { x: 2, y: 4, width: 26, height: 10, rx: 3, style: "fill:var(--chip-tool)" });
    if (k === "a2ui") c("rect", { x: 2, y: 4, width: 26, height: 10, rx: 3, style: "fill:var(--chip-a2ui)" });
    if (k === "flow") c("path", { d: "M2 9 H26", style: "stroke:var(--edge);stroke-width:1.4", "marker-end": "url(#arr)" });
    if (k === "loop") c("path", { d: "M2 9 H26", style: "stroke:var(--edge);stroke-width:1.4;stroke-dasharray:2 3" });
    if (k === "data") c("path", { d: "M2 9 H26", style: "stroke:var(--edge-data);stroke-width:1.4;stroke-dasharray:5 4" });
    s.appendChild(sv); s.appendChild(document.createTextNode(label)); legend.appendChild(s);
  });
  // details
  const panel = document.getElementById("details");
  const laneLabel = id => lanes[laneIdx[id]].label;
  const typeLabel = n => n.type === "gateway" ? (n.variant === "parallel" ? "Parallel gateway" : "Exclusive gateway") : n.type === "start" ? "Start event" : n.type === "end" ? "End event" : n.type === "intermediate" ? "Intermediate message event" : n.icon === "db" ? "Service task (data store)" : n.type === "user" ? "User task" : n.type === "service" ? "Service task" : ["main", "memory", "doc"].includes(n.lane) ? "Task (agent, model call)" : "Task";
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const list = a => a.length ? a.map(x => "<code>" + esc(x) + "</code>").join(" ") : '<span class="none">none</span>';
  const order = nodes.map(n => n.id);
  let selected = null;
  function openDetails(id) {
    const n = byId[id]; selected = id;
    Object.values(nodeEls).forEach(g => g.classList.remove("sel")); nodeEls[id].classList.add("sel");
    edgeEls.forEach(o => { const hit = o.e[0] === id || o.e[1] === id; o.g.classList.toggle("hl", hit); o.p.setAttribute("marker-end", hit ? "url(#arrh)" : (o.kind === "data" ? "url(#arrd)" : "url(#arr)")); });
    const into = FLOW.edges.filter(e => e[1] === id).map(e => e[0] + (e[2] ? " (" + e[2] + ")" : "")), out = FLOW.edges.filter(e => e[0] === id).map(e => e[1] + (e[2] ? " (" + e[2] + ")" : ""));
    const i = order.indexOf(id);
    panel.innerHTML = `<button class="close" aria-label="Close details">Close</button>
      <div class="meta">${esc(n.id)} · ${esc(laneLabel(n.lane))}</div><h2>${esc(n.name)}</h2><div class="meta">${esc(typeLabel(n))}</div>
      <dl><dt>What happens</dt><dd>${esc(n.what)}</dd>
      <dt>Tool calls</dt><dd>${list(n.tools)}</dd>
      <dt>A2UI calls and messages</dt><dd>${list(n.a2ui)}</dd>
      <dt>State paths written</dt><dd>${list(n.state)}</dd>
      <dt>Events</dt><dd>${list(n.events)}</dd>
      <dt>Model calls</dt><dd>${n.calls}${n.calls_note ? " (" + esc(n.calls_note) + ")" : ""}</dd>
      <dt>Comes from</dt><dd>${list(into)}</dd><dt>Goes to</dt><dd>${list(out)}</dd></dl>
      <div class="nav"><button data-go="${i > 0 ? order[i - 1] : ""}" ${i > 0 ? "" : "disabled"}>← Previous</button><button data-go="${i < order.length - 1 ? order[i + 1] : ""}" ${i < order.length - 1 ? "" : "disabled"}>Next →</button></div>`;
    panel.classList.add("open");
    panel.querySelector(".close").onclick = closeDetails;
    panel.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { if (b.dataset.go) { openDetails(b.dataset.go); scrollToNode(b.dataset.go); } });
  }
  function closeDetails() { panel.classList.remove("open"); Object.values(nodeEls).forEach(g => g.classList.remove("sel")); edgeEls.forEach(o => { o.g.classList.remove("hl"); o.p.setAttribute("marker-end", o.kind === "data" ? "url(#arrd)" : "url(#arr)"); }); if (selected && nodeEls[selected]) nodeEls[selected].focus(); selected = null; }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && panel.classList.contains("open")) closeDetails(); });
  const scroller = document.getElementById("scroller"), canvas = document.getElementById("canvas");
  let zoom = 1;
  function scrollToNode(id) { const n = byId[id]; scroller.scrollTo({ left: Math.max(0, (cx(n) - 300) * zoom), top: Math.max(0, (cy(n) - 160) * zoom), behavior: "smooth" }); }
  // zoom
  function setZoom(z) { zoom = Math.max(0.3, Math.min(1.6, z)); canvas.style.zoom = zoom; document.getElementById("zval").textContent = Math.round(zoom * 100) + "%"; }
  document.getElementById("zin").onclick = () => setZoom(zoom + 0.1);
  document.getElementById("zout").onclick = () => setZoom(zoom - 0.1);
  document.getElementById("z100").onclick = () => setZoom(1);
  document.getElementById("zfit").onclick = () => setZoom((scroller.clientHeight - 4) / H);
  // filter
  document.getElementById("q").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    nodes.forEach(n => { const hay = [n.id, n.name, n.what].concat(n.tools, n.a2ui, n.state, n.events).join(" ").toLowerCase(); nodeEls[n.id].classList.toggle("dim", !!q && !hay.includes(q)); });
    edgeEls.forEach(o => o.g.classList.toggle("dim", !!q));
  });
  // table
  const tbl = document.getElementById("table");
  tbl.innerHTML = "<thead><tr><th>Step</th><th>Lane</th><th>BPMN element</th><th>What happens</th><th>Tool calls</th><th>A2UI calls → messages</th><th>State paths written</th><th>Events</th><th>Model calls</th></tr></thead><tbody>" +
    nodes.map(n => `<tr data-id="${n.id}"><td class="id">${n.id}</td><td>${esc(laneLabel(n.lane))}</td><td>${esc(typeLabel(n))}</td><td><b>${esc(n.name)}.</b> ${esc(n.what)}</td><td>${list(n.tools)}</td><td>${list(n.a2ui)}</td><td>${list(n.state)}</td><td>${list(n.events)}</td><td>${n.calls}${n.calls_note ? "<br><span class='none'>" + esc(n.calls_note) + "</span>" : ""}</td></tr>`).join("") + "</tbody>";
  tbl.querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", () => { openDetails(tr.dataset.id); scrollToNode(tr.dataset.id); scroller.scrollIntoView({ behavior: "smooth", block: "start" }); }));
})();
</script>
</body>
