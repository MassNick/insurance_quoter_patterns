[project]
name = "document-agent"
version = "0.1.0"
description = "Foundry prompt agent document-agent: definition, strict output schema and deploy script."
requires-python = ">=3.13"
dependencies = ["quote-common", "jsonschema>=4.23"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.15", "pyyaml>=6"] # pyyaml: deploy_document_agent.py reads settings.yaml
deploy = ["azure-ai-projects>=2.11", "azure-identity>=1.25", "pyyaml>=6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["document_agent.py", "prompts"]

[tool.uv.sources]
quote-common = { path = "../../packages/quote_common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["unit: one function or class, no I/O"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", # pydocstyle: every module, class, function and method has a docstring
]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"] # test functions and fixtures need no docstring; test modules, classes and helpers do
