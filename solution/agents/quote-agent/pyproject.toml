[project]
name = "quote-agent"
version = "0.1.0"
description = "Hosted agent quote-agent: main agent + memory agent on Microsoft Agent Framework, Foundry invocations protocol."
requires-python = ">=3.13"
dependencies = [
    "agent-framework-core==1.26.0",
    "agent-framework-foundry==1.16.2",
    "agent-framework-foundry-hosting==1.0.0b261112",
    "agent-framework-azure-cosmos==1.0.0b261112",
    "azure-ai-agentserver-invocations==1.3.0",
    "azure-identity>=1.25",
    "mcp>=2.2,<3",
    "jsonschema>=4.23",
    "quote-common",
]

[project.optional-dependencies]
test = ["pytest>=8", "anyio>=4", "ruff>=0.15"]
deploy = ["azure-ai-projects>=2.11", "pyyaml>=6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quote_agent"]

[tool.uv.sources]
quote-common = { path = "../../packages/quote_common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["unit: one function or class, no I/O", "component: the service in-process with fakes"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", # pydocstyle: every module, class, function and method has a docstring
]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"] # test functions and fixtures need no docstring; test modules, classes and helpers do
