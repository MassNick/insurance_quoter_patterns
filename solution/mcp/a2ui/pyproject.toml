[project]
name = "mcp-a2ui"
version = "0.1.0"
description = "MCP server that compiles a FormSpec into A2UI 1.0 (one createSurface with components and dataModel)."
requires-python = ">=3.13"
dependencies = ["quote-common", "mcp>=2.2,<3", "jsonschema>=4.20", "uvicorn>=0.31"]

[project.optional-dependencies]
# What Azure needs on top: the Entra check (quote_common.auth) and the Application Insights export of the shared logger.
azure = ["quote-common[auth]", "azure-monitor-opentelemetry>=1.6"]
test = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
quote-common = { path = "../../packages/quote_common", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_a2ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: one function or class, no I/O",
    "golden: Python compiler output equals the JavaScript reference compiler's",
    "component: the MCP server running in-process over its ASGI app",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]  # line length is left to `ruff format`
extend-select = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]  # a docstring on every module, class, function and method

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]  # test functions are described by their names
