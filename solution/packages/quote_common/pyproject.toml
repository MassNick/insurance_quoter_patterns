[project]
name = "quote-common"
version = "0.1.0"
description = "Shared contracts, catalog, JSON Pointer, event envelope and session_ref helpers for the auto quoting services."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
auth = ["PyJWT>=2.8", "cryptography>=42"]
test = ["pytest>=8", "PyJWT>=2.8", "cryptography>=42"]

[project.entry-points.pytest11]
quote_common = "quote_common.pytest_plugin"  # the azure test level (RUN_AZURE_TESTS=1), in every service

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quote_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: fast, isolated tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
extend-select = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]  # a docstring on every module, class, function and method

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D103"]  # test functions are described by their names
