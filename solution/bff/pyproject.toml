[project]
name = "quote-bff"
version = "0.1.0"
description = "BFF for the auto quoting chat: session state owner, merge rules, double confirmations, end-of-form rules and hand-offs, SSE relay."
requires-python = ">=3.12"
dependencies = [
    "quote-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "jsonschema>=4.22",
    "opentelemetry-api>=1.25",
]

[project.optional-dependencies]
# Azure adapters (Cosmos DB, Blob Storage, Entra tokens). Imported lazily: the in-memory adapters need none of them.
azure = [
    "azure-identity>=1.17",
    "azure-cosmos>=4.7",
    "azure-storage-blob>=12.20",
    "aiohttp>=3.9",
]
# Azure Monitor exporter and auto-instrumentation. Off by default (OTEL_ENABLED=false).
telemetry = [
    "azure-monitor-opentelemetry>=1.6",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]
test = [
    "pytest>=8",
    "anyio>=4.4",
    "ruff>=0.6",
]

[project.scripts]
quote-bff = "quote_bff.app:run"

[tool.uv.sources]
quote-common = { path = "../packages/quote_common", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quote_bff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: one function or class, no I/O",
    "component: the BFF in-process (FastAPI TestClient), every external dependency faked",
]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "C4",
    # pydocstyle, presence only: every module, package, class, function and method has a docstring
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
]
ignore = [
    "RUF001",  # French typography (’, «, non-breaking spaces) is intended in customer-facing strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PT009", "PT018", "PT027", "B011", "D103"]  # D103: test_* names say what they check
# The rules tests are unittest classes copied from the design folder: their test_* methods (D102) are named like the
# pytest functions above. Their classes and helpers still carry docstrings.
"tests/unit/rules/test_end_of_form.py" = ["D102"]
# Copied unchanged from the design folder (bff/rules): keep it byte-identical to its source.
"src/quote_bff/rules/end_of_form.py" = ["S", "UP017", "UP042", "RUF100"]
