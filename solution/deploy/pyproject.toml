[project]
name = "quote-deploy"
version = "0.1.0"
description = "Foundry data-plane deployment scripts for the auto quoting solution (toolbox, knowledge base, smoke tests, visual review)."
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6"] # pyyaml: create_knowledge_base.py reads settings.yaml

[project.optional-dependencies]
# Real runs only: dry runs and the tests use fakes and need no Azure SDK.
azure = ["azure-identity>=1.17"]
test = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.23"] # jsonschema: check_contracts.py

[tool.uv]
package = false # scripts, not a library

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT", "RET", "C4",
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", # pydocstyle: every module, class, function and method has a docstring
]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "PT018", "RUF005", "RUF015", "RUF059", "D103"] # D103: test functions and fixtures need no docstring
"visual_review.py" = ["E501"] # the review prompt is prose
