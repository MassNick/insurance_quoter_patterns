<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie de formulaires A2UI</title>
<meta name="description" content="Agent-generated A2UI forms for auto insurance quoting, Desjardins demo (Variation C). Each form plays the ball-to-form animation from the bot and shows the FormSpec and the compiled A2UI 1.0 message.">
<!--
  LOCAL DEMO FOR A CLIENT. Simulated, no network calls.
  The brand mark is a placeholder approximation of the Desjardins logo; replace ICON.brand in a2ui.js with the official asset before showing it externally.
-->
<style>
/* @inline styles.css */
.g-app { height: 100vh; display: flex; flex-direction: column; }
.app-header { height: 64px; background: var(--g3); color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 20px; flex: none; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark svg { width: 28px; height: 31px; display: block; }
.brand .wm { display: flex; flex-direction: column; line-height: 1.05; }
.brand .wm b { font-size: 20px; letter-spacing: -.02em; }
.brand .wm small { font-size: 12px; color: #CFE6DA; font-weight: 500; }
.demo-badge { font-size: 11.5px; font-weight: 600; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: 2px 10px; color: #CFE6DA; white-space: nowrap; }
.header-spacer { flex: 1; }
.app-header .btn { background: transparent; color: #fff; border: 1px solid #fff; height: 36px; font-size: 13.5px; }
.app-header .btn[aria-pressed="true"] { background: #fff; color: var(--g3); }
.g-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px minmax(0, 1fr); }
.g-side { border-right: 1px solid var(--line-3); background: #fff; overflow-y: auto; padding: 10px 8px 24px; }
.g-group { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--g); padding: 14px 10px 4px; }
.g-item { display: flex; gap: 10px; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 10px; align-items: baseline; color: var(--ink-2); font-weight: 500; }
.g-item:hover { background: var(--m4); }
.g-item[aria-current="true"] { background: var(--m2); color: var(--ink); }
.g-n { font: 600 11px var(--mono); color: var(--ink-3); min-width: 18px; }
.g-item[aria-current="true"] .g-n { color: var(--g); }
.g-body { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.g-bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line-3); background: #fff; flex-wrap: wrap; }
.g-bar h1 { font-size: 18px; margin: 0; font-weight: 400; color: var(--g); }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font-size: 11px; font-weight: 600; color: var(--g3); background: var(--m2); padding: 1px 8px; border-radius: 99px; }
.vtabs { display: flex; gap: 2px; background: var(--gray); border-radius: 999px; padding: 3px; }
.vtab { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-weight: 600; font-size: 12.5px; color: var(--ink-2); }
.vtab[aria-selected="true"] { background: #fff; color: var(--g); box-shadow: var(--shadow-sm); }
.vpanel { flex: 1; min-height: 0; position: relative; }
.vpanel.code { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.vpanel.code > * { flex: none; }
.tok { font-size: 12.5px; color: var(--ink-2); background: var(--m3); border-left: 4px solid var(--g); padding: 8px 12px; border-radius: 0 10px 10px 0; }
.ws { position: absolute; inset: 0; overflow: hidden; }
.mini { position: absolute; top: 16px; bottom: 16px; transition: left .45s cubic-bezier(.2, .8, .2, 1), width .45s cubic-bezier(.2, .8, .2, 1); }
.mini .chat-scroll { padding-top: 16px; }
.mini-foot { border-top: 1px solid var(--line-3); padding: 8px 12px; font-size: 12px; color: var(--ink-3); }
.gstage { position: absolute; top: 16px; bottom: 16px; display: flex; justify-content: center; align-items: flex-start; z-index: 2; }
.gstage > .form-card { width: 100%; max-width: 720px; }
.ws.narrow .gstage { background: color-mix(in srgb, var(--m3) 70%, transparent); }
.again { display: flex; gap: 6px; margin-top: 8px; }
details.vals { margin-top: 6px; font-size: 12px; }
details.vals summary { cursor: pointer; color: var(--ink-2); font-weight: 600; }
details.vals pre { margin-top: 6px; max-height: 220px; }
.tip { position: fixed; z-index: 100; max-width: 260px; background: #1F1F1F; color: #fff; font-size: 12.5px; line-height: 1.45; padding: 8px 11px; border-radius: 6px; pointer-events: none; }
.tip b { display: block; margin-bottom: 2px; }
#menu { display: none; }
#tour .sm { display: none; }
@media (max-width: 520px) { #tour .lg { display: none; } #tour .sm { display: inline; } .brand .wm small, .demo-badge { display: none; } .app-header { gap: 8px; padding: 0 10px; } .g-bar .tags { display: none; } }
@media (max-width: 860px) {
  .g-main { grid-template-columns: minmax(0, 1fr); }
  .g-side { position: fixed; top: 64px; bottom: 0; left: 0; width: min(300px, 88vw); z-index: 40; transform: translateX(-105%); transition: transform .3s; box-shadow: var(--shadow-lg); }
  .g-side.open { transform: none; }
  #menu { display: inline-flex; }
}
</style>
</head>
<body>
<div class="g-app">
  <header class="app-header">
    <button class="btn small" id="menu" aria-label="Afficher la liste des formulaires">Formulaires</button>
    <div class="brand"><span class="brand-mark" id="brand-mark"></span><span class="wm"><b>Desjardins</b><small>Galerie de formulaires A2UI · <span id="g-count"></span> formulaires</small></span></div>
    <span class="demo-badge">Simulé · logo provisoire</span>
    <div class="header-spacer"></div>
    <button class="btn" id="tour" aria-pressed="false" title="Joue chaque formulaire : ouverture, remplissage, envoi, suivant"><span class="lg">Visite automatique</span><span class="sm">Visite</span></button>
  </header>
  <div class="g-main">
    <nav class="g-side" id="g-side" aria-label="Formulaires"><div id="g-list"></div></nav>
    <section class="g-body">
      <div class="g-bar">
        <h1 id="g-title"></h1>
        <div class="tags" id="g-tags"></div>
        <div class="header-spacer"></div>
        <div class="vtabs" role="tablist">
          <button class="vtab" role="tab" data-p="p-preview" aria-selected="true">Aperçu</button>
          <button class="vtab" role="tab" data-p="p-spec" aria-selected="false">FormSpec (agent)</button>
          <button class="vtab" role="tab" data-p="p-a2ui" aria-selected="false">Messages A2UI</button>
        </div>
        <button class="btn small" id="replay">Rejouer</button>
        <button class="btn small primary" id="next">Suivant →</button>
      </div>
      <div class="vpanel" id="p-preview" role="tabpanel">
        <div class="ws" id="ws">
          <section class="chat mini" id="mini" aria-label="Aperçu de la conversation">
            <div class="chat-scroll" id="mini-scroll"></div>
            <div class="mini-foot">Envoyez le formulaire (ou « Démo : remplir ») pour voir l’animation inverse.</div>
          </section>
          <div class="gstage" id="gstage" hidden></div>
        </div>
      </div>
      <div class="vpanel code" id="p-spec" role="tabpanel" hidden></div>
      <div class="vpanel code" id="p-a2ui" role="tabpanel" hidden></div>
    </section>
  </div>
</div>
<script>/* @inline-json STATE_CATALOG ../../contracts/state-catalog.json */</script>
<script>/* @inline a2ui.js */</script>
<script>/* @inline forms.js */</script>
<script>/* @inline gallery.js */</script>
<script>
/* hover help on field labels */
(function () {
  let tip = null;
  const hide = () => { if (tip) { tip.remove(); tip = null; } };
  const show = (t) => { hide(); if (!t.dataset.help) return; const r = t.getBoundingClientRect(); tip = document.createElement('div'); tip.className = 'tip'; tip.innerHTML = '<b></b>'; tip.firstChild.textContent = t.dataset.title || ''; tip.append(t.dataset.help); document.body.append(tip); tip.style.left = Math.max(12, Math.min(r.left, innerWidth - tip.offsetWidth - 12)) + 'px'; tip.style.top = (r.bottom + 8) + 'px'; };
  document.addEventListener('mouseover', (e) => { const t = e.target.closest('[data-help]'); if (t) show(t); });
  document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-help]')) hide(); });
  document.addEventListener('focusin', (e) => { const t = e.target.closest('[data-help]'); if (t) show(t); });
  document.addEventListener('focusout', hide);
})();
</script>
</body>
</html>
